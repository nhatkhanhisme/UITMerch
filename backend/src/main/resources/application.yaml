server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  environment: ${APP_ENVIRONMENT:production}
  maintenance:
    database-scheduler: ${APP_MAINTENANCE_DATABASE_SCHEDULER:false}
  audit:
    retention-days: ${APP_AUDIT_RETENTION_DAYS:90}
  dev:
    otp-endpoint: ${APP_DEV_OTP_ENDPOINT:false}
    seed-data: ${APP_DEV_SEED_DATA:false}
    mock-mail: ${APP_DEV_MOCK_MAIL:false}
  checkout:
    max-quantity: ${APP_CHECKOUT_MAX_QUANTITY:10}
    max-pending: ${APP_CHECKOUT_MAX_PENDING:3}
    pending-hours: ${APP_CHECKOUT_PENDING_HOURS:48}
    expiry-enabled: ${APP_CHECKOUT_EXPIRY_ENABLED:true}
  rate-limit:
    shared: ${APP_RATE_LIMIT_SHARED:true}
  auth:
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}
  # JWT Configuration
  # NFR01: JWT access tokens utilized for session management
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: ${APP_JWT_EXPIRATION:900000}  # 15 minutes in milliseconds
    refresh-expiration: ${APP_JWT_REFRESH_EXPIRATION:604800000}  # 7 days in milliseconds

  mail:
    from-name: ${APP_MAIL_FROM_NAME:UITMerch}

  # CORS: comma-separated list of allowed origins
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  # AI — Google Gemini for visual merch search (gemini-2.5-flash, free tier via aistudio.google.com)
  # GEMINI_API_KEYS: comma-separated list for key rotation (preferred).
  # GEMINI_API_KEY:  single key, used as fallback if GEMINI_API_KEYS is not set.
  ai:
    gemini-api-keys: ${GEMINI_API_KEYS:}
    gemini-api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash

  # Trusted reverse-proxy IPs — only these remoteAddrs are allowed to set X-Forwarded-For.
  # Leave blank (default) when running without a proxy; set to your load-balancer IP in production.
  proxy:
    trusted-ips: ${APP_TRUSTED_PROXY_IPS:}

  # Supabase Storage Configuration
  # NFR03: Supabase Storage used for images; Base64/BLOB persistence in DB is strictly prohibited
  storage:
    avatar-bucket: ${APP_STORAGE_AVATAR_BUCKET:avatars}
    organization-bucket: ${APP_STORAGE_ORG_BUCKET:org-assets}
    endpoint: ${SUPABASE_STORAGE_ENDPOINT}
    region: ${SUPABASE_STORAGE_REGION}
    access-key: ${SUPABASE_STORAGE_S3_ACCESS_KEY_ID}
    secret-key: ${SUPABASE_STORAGE_S3_SECRET_KEY}
    public-url: ${SUPABASE_PROJECT_URL}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: uitmerch-backend
  task:
    scheduling:
      pool:
        size: 3
  main:
    lazy-initialization: true
  data:
    web:
      pageable:
        max-page-size: 200
        default-page-size: 20

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: true
            required: true
  
  # PostgreSQL Datasource Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/uitmerch}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET search_path TO public, extensions
      maximum-pool-size: ${APP_DB_POOL_MAX:10}
      minimum-idle: ${APP_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${APP_DB_CONNECTION_TIMEOUT_MS:20000}
  
  # JPA & Hibernate Configuration
  # CRITICAL: ddl-auto=none enforces Flyway as the ONLY schema migration tool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 50
          fetch_size: 50
        order_inserts: true
        order_updates: true
  
  # Flyway Configuration - Strict Schema Versioning
  flyway:
    enabled: true
    postgresql:
      # Session advisory lock: transactional locks can stall concurrent index builds.
      transactional-lock: false
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
  
# OpenAPI/Swagger Documentation — disabled by default in production
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 300ms,500ms,1s

# Set SWAGGER_ENABLED=true to re-enable (e.g. for staging environments)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persistAuthorization: true
    tryItOutEnabled: true
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    root: INFO
    com.uitmerch: INFO
    org.flywaydb: WARN
    org.hibernate.Version: WARN
    org.hibernate.jpa.internal.util.LogHelper: WARN
    org.hibernate.engine.transaction.jta.platform.internal.JtaPlatformInitiator: ERROR
    org.springframework.data.repository.config.RepositoryConfigurationDelegate: WARN
    com.zaxxer.hikari.HikariDataSource: WARN
