name: Production operations
on:
  schedule:
    - cron: '11,41 * * * *'
    - cron: '23 20 * * *'
  workflow_dispatch:
    inputs:
      task:
        type: choice
        description: Operation
        options: [monitor, backup]
        default: monitor
permissions:
  contents: read
jobs:
  monitor:
    if: github.event.schedule != '23 20 * * *' && (github.event_name != 'workflow_dispatch' || inputs.task == 'monitor')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check public auth, audit persistence and database job health
        env:
          PGHOST: aws-1-ap-southeast-2.pooler.supabase.com
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: uitmerch_monitor.aubfixpblwlpsfgmwmza
          PGPASSWORD: ${{ secrets.UITMERCH_MONITOR_PASSWORD }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '20'
          PGOPTIONS: '-c statement_timeout=60000'
        run: python3 scripts/operations/monitor.py
  backup:
    if: github.event.schedule == '23 20 * * *' || (github.event_name == 'workflow_dispatch' && inputs.task == 'backup')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL 17 client and backup SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          python3 -m pip install -r scripts/operations/requirements.txt
      - name: Encrypt database and all Storage objects
        env:
          PGHOST: aws-1-ap-southeast-2.pooler.supabase.com
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: uitmerch_backup.aubfixpblwlpsfgmwmza
          PGPASSWORD: ${{ secrets.UITMERCH_BACKUP_PASSWORD }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '20'
          PGOPTIONS: '-c statement_timeout=60000'
          SUPABASE_STORAGE_ENDPOINT: ${{ secrets.SUPABASE_STORAGE_ENDPOINT }}
          SUPABASE_STORAGE_REGION: ${{ secrets.SUPABASE_STORAGE_REGION }}
          SUPABASE_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
          SUPABASE_STORAGE_S3_SECRET_KEY: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_KEY }}
        run: python3 scripts/operations/backup.py
      - name: Store encrypted off-provider backup
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-production-backup-${{ github.run_id }}
          path: operations-backup.cms
          retention-days: 7
          if-no-files-found: error
