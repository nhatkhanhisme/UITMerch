name: CI / CD — Backend and Frontend

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Backend build and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Run all tests with disposable PostgreSQL
        env:
          UITMERCH_TEST_POSTGRES_IMAGE: pgvector/pgvector:pg17
        run: ./scripts/test-postgres.sh -B -q
      - name: Package backend
        run: ./mvnw package -DskipTests -B -q
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: /tmp/uitmerch-backend-test.*/target/surefire-reports/
          retention-days: 7

  frontend_tests:
    name: Frontend build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # The production build must use the frontend proxy even with a legacy API setting.
          VITE_API_BASE_URL: "https://api-build-fixture.example.invalid"
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.csp.config.ts
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  security:
    name: Dependency and secret scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            scripts/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan locked backup SDK dependencies
        run: |
          python3 -m pip install pip-audit==2.10.1
          python3 -m pip_audit -r scripts/operations/requirements.txt
      - name: Scan dependencies with expiring scoped exceptions
        run: python3 scripts/security-check.py --report security-report.json
      - name: Scan source for secrets with redaction
        if: always()
        run: ./scripts/scan-secrets.sh secret-scan.json
      - name: Upload sanitized security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            security-report.json
            secret-scan.json
          retention-days: 7

  deploy:
    name: Deploy to Render
    environment: production
    runs-on: ubuntu-latest
    needs: [test, frontend_tests, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production-backend-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Validate and migrate with credentials isolated from application runtime
        working-directory: backend
        env:
          UITMERCH_MIGRATION_URL: ${{ secrets.UITMERCH_MIGRATION_URL }}
          UITMERCH_MIGRATION_USER: ${{ secrets.UITMERCH_MIGRATION_USER }}
          UITMERCH_MIGRATION_PASSWORD: ${{ secrets.UITMERCH_MIGRATION_PASSWORD }}
          FLYWAY_POSTGRESQL_TRANSACTIONAL_LOCK: 'false'
        run: |
          test -n "$UITMERCH_MIGRATION_URL" && test -n "$UITMERCH_MIGRATION_USER" && test -n "$UITMERCH_MIGRATION_PASSWORD"
          ./mvnw -B -q flyway:migrate flyway:validate
      - name: Trigger Render redeploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS --max-time 30 "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}" >/dev/null
      - name: Wait for tested commit and public API readiness
        env:
          RENDER_PUBLIC_API_URL: ${{ vars.RENDER_PUBLIC_API_URL || 'https://uitmerch-backend.onrender.com' }}
        run: python3 scripts/operations/wait-for-deploy.py
