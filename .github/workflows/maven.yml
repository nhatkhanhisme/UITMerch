name: CI / CD — Backend and Frontend

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Backend build and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Run all tests with disposable PostgreSQL
        env:
          UITMERCH_TEST_POSTGRES_IMAGE: pgvector/pgvector:pg17
        run: ./scripts/test-postgres.sh -B -q
      - name: Package backend
        run: ./mvnw package -DskipTests -B -q
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: /tmp/uitmerch-backend-test.*/target/surefire-reports/
          retention-days: 7

  frontend_tests:
    name: Frontend build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, frontend_tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render redeploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS --max-time 30 "$RENDER_DEPLOY_HOOK_URL"
      - name: Check public campaign API readiness
        env:
          RENDER_PUBLIC_API_URL: ${{ vars.RENDER_PUBLIC_API_URL || 'https://uitmerch-backend.onrender.com' }}
        run: curl -fsS --max-time 20 --retry 10 --retry-all-errors --retry-delay 15 "${RENDER_PUBLIC_API_URL%/}/api/v1/public/campaigns?size=1" >/dev/null
